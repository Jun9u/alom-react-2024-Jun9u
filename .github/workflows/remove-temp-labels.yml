name: Remove unrequested shared labels
on:
  push:
    paths:
      - .github/workflows/remove-temp-labels.yml
permissions:
  contents: read
  issues: write
jobs:
  remove-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              'area:ai', 'area:data', 'area:frontend', 'area:backend',
              'area:infra', 'area:docs', 'priority:high',
              'priority:medium', 'priority:low', 'blocked', 'needs-decision'
            ];
            const { owner, repo } = context.repo;
            for (const name of labels) {
              try {
                await github.rest.issues.deleteLabel({owner, repo, name});
                core.info(`Removed ${name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`Not found ${name}`);
              }
            }
