name: Feature request
description: Propose a new capability or improvement
title: "[Feature] "
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or tradeoffs
